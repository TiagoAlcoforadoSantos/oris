{% extends "base.html" %}

{% block title %}Acesso negado — ORIS{% endblock %}

{% block breadcrumb %}
    <span class="oris-breadcrumb-current">Acesso negado</span>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="oris-panel text-center">
            <i class="bi bi-shield-exclamation" style="font-size: 2.5rem; color: var(--oris-danger);" aria-hidden="true"></i>
            <h1 class="h3 mt-3">Acesso não autorizado</h1>
            <p class="text-muted">
                Você não possui permissão para acessar este recurso.
            </p>
            <a href="{{ url_for('main.index') }}" class="btn btn-primary mt-2">
                <i class="bi bi-house" aria-hidden="true"></i> Voltar ao início
            </a>
        </div>
    </div>
</div>
{% endblock %}
